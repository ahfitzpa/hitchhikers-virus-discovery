name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and lint dependencies
        run: python -m pip install --upgrade pip pytest ruff pandas biopython
      - name: Lint with Ruff
        run: ruff check tests workflow/phase1/scripts workflow/phase2/scripts
      - name: Check Bash script syntax
        run: |
          for s in $(find workflow -name '*.sh' | sort); do
            bash -n "$s"
          done
      - name: Run full unit and integration test suite
        run: pytest -v
